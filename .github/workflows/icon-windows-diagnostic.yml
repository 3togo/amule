name: Icon Windows loader diagnostic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  icon:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-wxwidgets3.3-msw
      - name: Build isolated GUI test
        run: |
          clang -c src/icons/icon_data.c -o icons.o
          clang++ -std=c++17 -DUNICODE -D_UNICODE $(wx-config --cxxflags) -Isrc unittests/tests/IconArtworkTest.cpp src/CountryFlags.cpp src/MenuIcons.cpp src/CamuleArtProvider.cpp icons.o $(wx-config --libs core,base,net,stc) -o IconArtworkTest.exe
      - name: Inspect DLL imports
        run: python3 .github/pe_imports_diagnostic.py "$(cygpath -w "$PWD/IconArtworkTest.exe")" "$(cygpath -w "$WINDIR/System32")" "$(cygpath -w "$MINGW_PREFIX/bin")"
      - name: Run native GUI test
        run: ./IconArtworkTest.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-windows-diagnostic
          path: IconArtworkTest.exe
